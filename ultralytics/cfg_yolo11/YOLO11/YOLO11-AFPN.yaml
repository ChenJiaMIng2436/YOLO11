# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect, |  YOLO11Pro https://github.com/iscyy/YOLO11Pro

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 319 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 319 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 409 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 631 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 631 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]# 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]# 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]# 8
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLO11n head
head:
  - [4, 1, Conv, [64, 1, 1]] # 10：P3 (80x80) 通道统一为 64
  - [6, 1, Conv, [128, 1, 1]]# 11：P4 (40x40) 通道统一为 128
  - [9, 1, Conv, [256, 1, 1]]# 12：P5 (20x20) 通道统一为 256
  - [10, 1, Conv, [64, 1, 1]]# 13：重复统一
  - [11, 1, Conv, [128, 1, 1]]# 14
  - [12, 1, Conv, [256, 1, 1]]# 15
  - [[13, 14], 1, ASFF_2, [64, 0]]   # 16：P3尺度融合（输入P3和P4）
  - [[13, 14], 1, ASFF_2, [128, 1]]  # 17：P4尺度融合（输入P3和P4）
  - [16, 1, BasicBlock, [64]]# 18
  - [17, 1, BasicBlock, [128]]# 19
  - [[18, 19, 15], 1, ASFF_3, [64, 0]]   # 20：输出 P3 检测分支
  - [[18, 19, 15], 1, ASFF_3, [128, 1]]  # 21：输出 P4 检测分支
  - [[18, 19, 15], 1, ASFF_3, [256, 2]]  # 22：输出 P5 检测分支
  - [20, 1, BasicBlock, [64]]# 23
  - [21, 1, BasicBlock, [128]]# 24
  - [22, 1, BasicBlock, [256]]# 25
  - [23, 1, Conv, [256, 1, 1]]# 26
  - [24, 1, Conv, [512, 1, 1]]# 27
  - [25, 1, Conv, [1024, 1, 1]]# 28

  - [[26, 27, 28], 1, Detect, [nc]]  # Detect(P3, P4, P5)
